name: dev

on:
  pull_request_target:
    branches: [dev]
    types: [closed]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.base.ref || github.ref_name }}
  cancel-in-progress: true

# 新加坡部署：使用新加坡阿里云镜像仓库 (ap-southeast-1)，k8s 使用 imagePullSecrets: registry-ali-sp
env:
  KUBECTL_VERSION: v1.32.2
  NAMESPACE: dev-ns
  REPO_NS: ${{ secrets.ALICLOUD_ACR_SP_NSDEV }}
  REGION_ID: ap-southeast-1
  DEPLOYMENT: table-search-dev

  REPO_PUB: ${{ secrets.ALICLOUD_ACR_SP_PUBLIC }}
  REPO_VPC: ${{ secrets.ALICLOUD_ACR_SP_VPC }}
  FEISHU_WEBHOOK_URL_DEV: ${{ secrets.FEISHU_WEBHOOK_URL_DEV }}
  KUBECONFIG_DEV: ${{ secrets.KUBECONFIG_DEV }}

jobs:
  build_and_push:
    if: |
      github.event_name == 'workflow_dispatch' || 
      (github.event_name == 'pull_request_target' && github.event.pull_request.merged == true)
    name: build_and_push
    permissions:
      contents: write
      actions: read
    runs-on: [ubuntu-22.04]
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.base.ref || github.ref }}

      - name: Generate Docker Tag
        id: docker_tag
        run: |
          datetime_now=$(TZ='Asia/Shanghai' date "+%Y%m%d%H%M%S")
          echo "DOCKER_TAG=${datetime_now}" >> $GITHUB_ENV
          echo "tag=${datetime_now}" >> $GITHUB_OUTPUT

      - name: Log in to private registry (base image)
        run: |
          docker login \
            -u ${{ secrets.ALI_DOCKER_REGISTRY_USERNAME_PENGHAO }} \
            -p ${{ secrets.ALI_DOCKER_REGISTRY_PASSWD_PENGHAO }} \
            ${{ secrets.ALI_DOCKER_REGISTRY }}

      - name: Log in to Aliyun ACR (cached)
        uses: ./.github/actions/get-acr-token
        with:
          access-key-id: ${{ secrets.ALICLOUD_ACCESS_KEY_PH }}
          secret-access-key: ${{ secrets.ALICLOUD_SECRET_KEY_PH }}
          instance-id: ${{ secrets.ALICLOUD_ACR_INSTANCE_ID }}
          registry-url: ${{ secrets.ALICLOUD_ACR_SP_PUBLIC }}
          region-id: ${{ env.REGION_ID }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push image (with layer cache)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ env.REPO_PUB }}/${{ env.REPO_NS }}/${{ env.DEPLOYMENT }}:${{ env.DOCKER_TAG }}
          cache-from: type=gha,scope=table-search-dev
          cache-to: type=gha,mode=min,scope=table-search-dev,ignore-error=true

      - name: Setup kubectl
        uses: ./.github/actions/setup-kubectl-ack
        with:
          kubectl-version: ${{ env.KUBECTL_VERSION }}
          kubeconfig-env: ${{ env.KUBECONFIG_DEV }}

      - name: Update
        run: |
          kubectl -n "${{ env.NAMESPACE }}" set image deployment/${{ env.DEPLOYMENT }} \
            ${{ env.DEPLOYMENT }}=${{ env.REPO_VPC }}/${{ env.REPO_NS }}/${{ env.DEPLOYMENT }}:${{ env.DOCKER_TAG }}

      - name: Notify Feishu - update
        uses: ./.github/actions/send-feishu-v2
        with:
          webhook: ${{ env.FEISHU_WEBHOOK_URL_DEV }}
          status-emoji: "🟢"
          title: "ACK: ${{ env.DEPLOYMENT }} released"
          details: |
            仓库: ${{ github.repository }}
            分支: ${{ github.ref_name }}
            提交: ${{ github.sha }}
            镜像: ${{ env.DOCKER_TAG }}

  notify_failed_job:
    name: notify_failed_job
    needs: [build_and_push]
    if: always() && needs.build_and_push.result == 'failure'
    runs-on: [ubuntu-22.04]
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.base.ref || github.ref }}
      
      - name: Notify Feishu - failed
        uses: ./.github/actions/send-feishu-v2
        with:
          webhook: ${{ env.FEISHU_WEBHOOK_URL_DEV }}
          status-emoji: "🔴"
          title: "ACK: ${{ env.DEPLOYMENT }} failed"
          details: |
            仓库: ${{ github.repository }}
            分支: ${{ github.ref_name }}
            提交: ${{ github.sha }}